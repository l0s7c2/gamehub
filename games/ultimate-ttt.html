<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终极井字棋 — GameHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: min(90vw, 480px);
            height: min(90vw, 480px);
            background: #555;
            padding: 8px;
            border-radius: 8px;
            border: 3px solid #666;
            flex-shrink: 0;
        }

        .big-cell {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            background: #2a2a2a;
            border-radius: 4px;
            padding: 5px;
            position: relative;
            border: 2px solid transparent;
            transition: border-color 0.15s, background 0.15s;
        }

        .big-cell.active {
            border-color: var(--accent);
            background: #1a1015;
        }

        .big-cell.free-target {
            border-color: #444;
        }

        .big-cell.done {
            opacity: 0.45;
        }

        .big-cell-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            pointer-events: none;
            z-index: 2;
            border-radius: 2px;
        }

        .big-cell-overlay.x { color: var(--accent2); }
        .big-cell-overlay.o { color: var(--accent); }

        .small-cell {
            background: #0d0d0d;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.7rem, 2.5vw, 1.1rem);
            font-weight: 700;
            cursor: default;
            transition: background 0.1s;
            position: relative;
            z-index: 3;
            aspect-ratio: 1;
        }

        .small-cell.playable {
            cursor: pointer;
        }

        .small-cell.playable:hover {
            background: #1a1a2e;
        }

        .small-cell.x { color: var(--accent2); }
        .small-cell.o { color: var(--accent); }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .current-turn {
            font-size: 1rem;
            font-weight: 600;
        }

        .current-turn .mark-x { color: var(--accent2); }
        .current-turn .mark-o { color: var(--accent); }

        .hint {
            font-size: 0.8rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="../index.html">← 返回</a>

        <div class="game-wrapper">
            <div class="status-bar">
                <span class="current-turn" id="turn-indicator"></span>
                <span class="hint" id="hint-text"></span>
            </div>

            <div class="score">
                <div class="score-item">
                    <div class="score-label mark-x">X 占领</div>
                    <div class="score-value" id="score-x">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label mark-o">O 占领</div>
                    <div class="score-value" id="score-o">0</div>
                </div>
            </div>

            <div class="board" id="board"></div>

            <button class="btn" id="reset-btn" style="margin-top:24px;">重新开始</button>
        </div>
    </div>

    <div class="overlay" id="overlay" style="display:none;">
        <div class="overlay-content">
            <h2 id="overlay-title"></h2>
            <p id="overlay-msg"></p>
            <button class="btn" id="overlay-btn">再来一局</button>
        </div>
    </div>

    <script>
(function() {
    const WIN_LINES = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    const boardEl       = document.getElementById('board');
    const turnIndicator = document.getElementById('turn-indicator');
    const hintText      = document.getElementById('hint-text');
    const scoreXEl      = document.getElementById('score-x');
    const scoreOEl      = document.getElementById('score-o');
    const overlay       = document.getElementById('overlay');
    const overlayTitle  = document.getElementById('overlay-title');
    const overlayMsg    = document.getElementById('overlay-msg');

    /* DOM refs built once */
    const bigEls   = [];   /* bigEls[bi] */
    const smallEls = [];   /* smallEls[bi][si] */
    const overlayEls = []; /* overlayEls[bi] */

    let state;

    /* ── state helpers ── */
    function initState() {
        state = {
            board: Array.from({length:9}, () => Array(9).fill(null)),
            bigBoard: Array(9).fill(null),
            currentPlayer: 'X',
            activeBigCell: null,
            gameOver: false,
            winner: null
        };
    }

    function checkWin(cells) {
        for (const [a,b,c] of WIN_LINES)
            if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c])
                return cells[a];
        return null;
    }

    function isFull(bi) { return state.board[bi].every(c => c !== null); }

    function isDone(bi) { return state.bigBoard[bi] !== null || isFull(bi); }

    function isPlayable(bi) {
        if (state.gameOver || isDone(bi)) return false;
        return state.activeBigCell === null || state.activeBigCell === bi;
    }

    function countConquered(p) { return state.bigBoard.filter(c => c === p).length; }

    /* ── build DOM once ── */
    function buildDOM() {
        boardEl.innerHTML = '';
        bigEls.length = 0;
        smallEls.length = 0;
        overlayEls.length = 0;

        for (let bi = 0; bi < 9; bi++) {
            const bigEl = document.createElement('div');
            bigEl.className = 'big-cell';

            const ov = document.createElement('div');
            ov.className = 'big-cell-overlay';
            ov.style.display = 'none';
            bigEl.appendChild(ov);
            overlayEls.push(ov);

            const cells = [];
            for (let si = 0; si < 9; si++) {
                const cell = document.createElement('div');
                cell.className = 'small-cell';
                cell.addEventListener('click', () => handleClick(bi, si));
                bigEl.appendChild(cell);
                cells.push(cell);
            }

            boardEl.appendChild(bigEl);
            bigEls.push(bigEl);
            smallEls.push(cells);
        }
    }

    /* ── patch DOM to match state (no rebuild) ── */
    function patch() {
        for (let bi = 0; bi < 9; bi++) {
            const bigEl = bigEls[bi];
            const playable = isPlayable(bi);
            const done = isDone(bi);
            const free = !state.gameOver && state.activeBigCell === null && !done;

            bigEl.classList.toggle('active',      playable);
            bigEl.classList.toggle('done',        done);
            bigEl.classList.toggle('free-target', free && !playable);

            /* big-cell overlay */
            const ov = overlayEls[bi];
            const owner = state.bigBoard[bi];
            if (owner) {
                ov.textContent = owner;
                ov.className = 'big-cell-overlay ' + owner.toLowerCase();
                ov.style.display = 'flex';
            } else {
                ov.style.display = 'none';
            }

            /* small cells */
            for (let si = 0; si < 9; si++) {
                const cell = smallEls[bi][si];
                const val = state.board[bi][si];
                cell.textContent = val || '';
                cell.className = 'small-cell' +
                    (val ? ' ' + val.toLowerCase() : '') +
                    (!state.gameOver && playable && !val ? ' playable' : '');
            }
        }

        /* scores */
        scoreXEl.textContent = countConquered('X');
        scoreOEl.textContent = countConquered('O');

        /* status */
        if (state.gameOver) {
            if (state.winner === 'draw') {
                turnIndicator.innerHTML = '平局';
                overlayTitle.textContent = '平局';
                overlayMsg.textContent = '双方势均力敌';
            } else {
                const cls = state.winner === 'X' ? 'mark-x' : 'mark-o';
                turnIndicator.innerHTML = '<span class="' + cls + '">' + state.winner + '</span> 获胜';
                overlayTitle.innerHTML  = '<span class="' + cls + '">' + state.winner + '</span> 获胜';
                overlayMsg.textContent  = '大局已定';
            }
            hintText.textContent = '';
            overlay.style.display = 'flex';
        } else {
            overlay.style.display = 'none';
            const cls = state.currentPlayer === 'X' ? 'mark-x' : 'mark-o';
            turnIndicator.innerHTML = '轮到 <span class="' + cls + '">' + state.currentPlayer + '</span>';
            hintText.textContent = state.activeBigCell === null ? '自由选择任意大格' : '在高亮区域落子';
        }
    }

    /* ── game logic ── */
    function handleClick(bi, si) {
        if (!isPlayable(bi) || state.board[bi][si]) return;

        state.board[bi][si] = state.currentPlayer;

        if (!state.bigBoard[bi] && checkWin(state.board[bi]))
            state.bigBoard[bi] = state.currentPlayer;

        const gameWinner = checkWin(state.bigBoard);
        if (gameWinner) {
            state.gameOver = true;
            state.winner = gameWinner;
        } else if (state.bigBoard.every((c,i) => c !== null || isFull(i))) {
            const x = countConquered('X'), o = countConquered('O');
            state.gameOver = true;
            state.winner = x > o ? 'X' : o > x ? 'O' : 'draw';
        }

        state.currentPlayer = state.currentPlayer === 'X' ? 'O' : 'X';
        state.activeBigCell = (!state.gameOver && !isDone(si)) ? si : null;

        patch();
    }

    function startGame() {
        initState();
        patch();
    }

    document.getElementById('reset-btn').addEventListener('click', startGame);
    document.getElementById('overlay-btn').addEventListener('click', startGame);

    buildDOM();
    startGame();
})();
    </script>
</body>
</html>
