<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终极井字棋 — GameHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .board-wrap {
            width: min(92vw, 460px);
            padding: 10px;
            background: #555;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .big-cell {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            background: #2a2a2a;
            border-radius: 4px;
            padding: 5px;
            position: relative;
            border: 2px solid transparent;
            transition: border-color 0.15s, background 0.15s;
        }

        .big-cell.active {
            border-color: var(--accent);
            background: #1a1015;
        }

        .big-cell.free-target {
            border-color: #3a3a3a;
        }

        .big-cell.done { opacity: 0.4; }

        .big-cell-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            pointer-events: none;
            z-index: 2;
        }

        .big-cell-overlay.x { color: var(--accent2); }
        .big-cell-overlay.o { color: var(--accent); }

        .small-cell {
            aspect-ratio: 1;
            background: #0d0d0d;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.6rem, 2vw, 1rem);
            font-weight: 700;
            cursor: default;
            transition: background 0.1s;
            position: relative;
            z-index: 3;
        }

        .small-cell.playable { cursor: pointer; }
        .small-cell.playable:hover { background: #1a1a2e; }
        .small-cell.x { color: var(--accent2); }
        .small-cell.o { color: var(--accent); }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .current-turn { font-size: 1rem; font-weight: 600; }
        .current-turn .mark-x { color: var(--accent2); }
        .current-turn .mark-o { color: var(--accent); }
        .hint { font-size: 0.8rem; color: var(--text-dim); }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="../index.html">← 返回</a>
        <div class="game-wrapper">
            <div class="status-bar">
                <span class="current-turn" id="turn-indicator"></span>
                <span class="hint" id="hint-text"></span>
            </div>
            <div class="score">
                <div class="score-item">
                    <div class="score-label mark-x">X 占领</div>
                    <div class="score-value" id="score-x">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label mark-o">O 占领</div>
                    <div class="score-value" id="score-o">0</div>
                </div>
            </div>
            <div class="board-wrap">
                <div class="board" id="board"></div>
            </div>
            <button class="btn" id="reset-btn" style="margin-top:24px;">重新开始</button>
        </div>
    </div>

    <div class="overlay" id="overlay" style="display:none;">
        <div class="overlay-content">
            <h2 id="overlay-title"></h2>
            <p id="overlay-msg"></p>
            <button class="btn" id="overlay-btn">再来一局</button>
        </div>
    </div>

    <script>
(function () {
    const WIN_LINES = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    const $ = id => document.getElementById(id);
    const boardEl      = $('board');
    const turnEl       = $('turn-indicator');
    const hintEl       = $('hint-text');
    const scoreX       = $('score-x');
    const scoreO       = $('score-o');
    const overlay      = $('overlay');
    const overlayTitle = $('overlay-title');
    const overlayMsg   = $('overlay-msg');

    /* DOM refs — built once */
    const bigEls     = [];
    const smallEls   = [];
    const ovEls      = [];

    let board, bigBoard, player, active, over, winner;

    function reset() {
        board  = Array.from({length:9}, () => Array(9).fill(null));
        bigBoard = Array(9).fill(null);
        player = 'X';
        active = null;
        over   = false;
        winner = null;
        patch();
    }

    function checkWin(cells) {
        for (const [a,b,c] of WIN_LINES)
            if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c])
                return cells[a];
        return null;
    }

    function isFull(bi)    { return board[bi].every(c => c); }
    function isDone(bi)    { return bigBoard[bi] || isFull(bi); }
    function isPlayable(bi){ return !over && !isDone(bi) && (active === null || active === bi); }
    function conquered(p)  { return bigBoard.filter(c => c === p).length; }

    function click(bi, si) {
        if (!isPlayable(bi) || board[bi][si]) return;
        board[bi][si] = player;

        if (!bigBoard[bi] && checkWin(board[bi])) bigBoard[bi] = player;

        const gw = checkWin(bigBoard);
        if (gw) {
            over = true; winner = gw;
        } else if (bigBoard.every((c,i) => c || isFull(i))) {
            const x = conquered('X'), o = conquered('O');
            over = true; winner = x > o ? 'X' : o > x ? 'O' : 'draw';
        }

        player = player === 'X' ? 'O' : 'X';
        active = (!over && !isDone(si)) ? si : null;
        patch();
    }

    function patch() {
        for (let bi = 0; bi < 9; bi++) {
            const playable = isPlayable(bi);
            const done     = isDone(bi);
            const free     = !over && active === null && !done;
            const el       = bigEls[bi];

            el.className = 'big-cell' +
                (playable ? ' active' : '') +
                (done     ? ' done'   : '') +
                (free && !playable ? ' free-target' : '');

            const ov = ovEls[bi];
            if (bigBoard[bi]) {
                ov.textContent = bigBoard[bi];
                ov.className   = 'big-cell-overlay ' + bigBoard[bi].toLowerCase();
                ov.style.display = 'flex';
            } else {
                ov.style.display = 'none';
            }

            for (let si = 0; si < 9; si++) {
                const v    = board[bi][si];
                const cell = smallEls[bi][si];
                cell.textContent = v || '';
                cell.className   = 'small-cell' +
                    (v ? ' ' + v.toLowerCase() : '') +
                    (!over && playable && !v ? ' playable' : '');
            }
        }

        scoreX.textContent = conquered('X');
        scoreO.textContent = conquered('O');

        if (over) {
            if (winner === 'draw') {
                turnEl.innerHTML      = '平局';
                overlayTitle.textContent = '平局';
                overlayMsg.textContent   = '双方势均力敌';
            } else {
                const cls = winner === 'X' ? 'mark-x' : 'mark-o';
                turnEl.innerHTML         = `<span class="${cls}">${winner}</span> 获胜`;
                overlayTitle.innerHTML   = `<span class="${cls}">${winner}</span> 获胜`;
                overlayMsg.textContent   = '大局已定';
            }
            hintEl.textContent    = '';
            overlay.style.display = 'flex';
        } else {
            overlay.style.display = 'none';
            const cls = player === 'X' ? 'mark-x' : 'mark-o';
            turnEl.innerHTML   = `轮到 <span class="${cls}">${player}</span>`;
            hintEl.textContent = active === null ? '自由选择任意大格' : '在高亮区域落子';
        }
    }

    /* build DOM once */
    for (let bi = 0; bi < 9; bi++) {
        const bigEl = document.createElement('div');
        bigEl.className = 'big-cell';

        const ov = document.createElement('div');
        ov.style.display = 'none';
        bigEl.appendChild(ov);
        ovEls.push(ov);

        const cells = [];
        for (let si = 0; si < 9; si++) {
            const cell = document.createElement('div');
            cell.className = 'small-cell';
            cell.addEventListener('click', () => click(bi, si));
            bigEl.appendChild(cell);
            cells.push(cell);
        }

        boardEl.appendChild(bigEl);
        bigEls.push(bigEl);
        smallEls.push(cells);
    }

    $('reset-btn').addEventListener('click', reset);
    $('overlay-btn').addEventListener('click', reset);
    reset();
})();
    </script>
</body>
</html>
