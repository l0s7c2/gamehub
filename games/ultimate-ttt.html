<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终极井字棋 — GameHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 1rem;
            font-weight: 600;
        }
        .mark-x { color: var(--accent2); }
        .mark-o { color: var(--accent); }
        .hint { font-size: 0.8rem; color: var(--text-dim); font-weight: 400; }

        /* 棋盘：用 CSS 变量统一控制尺寸，避免各层叠加溢出 */
        .board {
            --board-size: min(calc(100vw - 48px), 420px);
            --gap-outer: 6px;
            --gap-inner: 2px;
            width: var(--board-size);
            height: var(--board-size);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap-outer);
            background: #484848;
            padding: var(--gap-outer);
            border-radius: 8px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .big-cell {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap-inner);
            background: #1e1e1e;
            padding: var(--gap-inner);
            border-radius: 3px;
            position: relative;
            box-sizing: border-box;
        }

        .big-cell.done { opacity: 0.38; }

        .big-cell-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            font-weight: 900;
            pointer-events: none;
            z-index: 2;
        }
        .big-cell-overlay.x { color: var(--accent2); }
        .big-cell-overlay.o { color: var(--accent); }

        .small-cell {
            background: #0d0d0d;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: clamp(0.55rem, 1.8vw, 0.95rem);
            cursor: default;
            position: relative;
            z-index: 3;
            transition: background 0.1s;
        }
        .small-cell.playable { cursor: pointer; }
        .small-cell.playable:hover { background: #1a1a2e; }
        .small-cell.x { color: var(--accent2); }
        .small-cell.o { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="../index.html">← 返回</a>
        <div class="game-wrapper">
            <div class="status-bar">
                <span id="turn-indicator"></span>
                <span class="hint" id="hint-text"></span>
            </div>
            <div class="score">
                <div class="score-item">
                    <div class="score-label mark-x">X 占领</div>
                    <div class="score-value" id="score-x">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label mark-o">O 占领</div>
                    <div class="score-value" id="score-o">0</div>
                </div>
            </div>
            <div class="board" id="board"></div>
            <button class="btn" id="reset-btn" style="margin-top:24px;">重新开始</button>
        </div>
    </div>

    <div class="overlay" id="overlay" style="display:none;">
        <div class="overlay-content">
            <h2 id="overlay-title"></h2>
            <p id="overlay-msg"></p>
            <button class="btn" id="overlay-btn">再来一局</button>
        </div>
    </div>

    <script>
(function () {
    const WIN_LINES = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    const $ = id => document.getElementById(id);
    const boardEl = $('board');

    // DOM refs built once
    const bigEls   = [];
    const smallEls = [];
    const ovEls    = [];

    // Game state
    let board, bigBoard, player, active, over, winner;

    function reset() {
        board    = Array.from({length:9}, () => Array(9).fill(null));
        bigBoard = Array(9).fill(null);
        player   = 'X';
        active   = null;
        over     = false;
        winner   = null;
        patch();
    }

    function checkWin(cells) {
        for (const [a,b,c] of WIN_LINES)
            if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c])
                return cells[a];
        return null;
    }

    function isFull(bi)     { return board[bi].every(c => c); }
    function isDone(bi)     { return bigBoard[bi] || isFull(bi); }
    function isPlayable(bi) { return !over && !isDone(bi) && (active === null || active === bi); }
    function conquered(p)   { return bigBoard.filter(c => c === p).length; }

    function handleClick(bi, si) {
        if (!isPlayable(bi) || board[bi][si]) return;
        board[bi][si] = player;

        if (!bigBoard[bi] && checkWin(board[bi]))
            bigBoard[bi] = player;

        const gw = checkWin(bigBoard);
        if (gw) {
            over = true; winner = gw;
        } else if (bigBoard.every((c,i) => c || isFull(i))) {
            const x = conquered('X'), o = conquered('O');
            over = true; winner = x > o ? 'X' : o > x ? 'O' : 'draw';
        }

        player = player === 'X' ? 'O' : 'X';
        active = (!over && !isDone(si)) ? si : null;
        patch();
    }

    function patch() {
        for (let bi = 0; bi < 9; bi++) {
            const playable = isPlayable(bi);
            bigEls[bi].className = 'big-cell' + (isDone(bi) ? ' done' : '');

            const ov = ovEls[bi];
            if (bigBoard[bi]) {
                ov.textContent   = bigBoard[bi];
                ov.className     = 'big-cell-overlay ' + bigBoard[bi].toLowerCase();
                ov.style.display = 'flex';
            } else {
                ov.style.display = 'none';
            }

            for (let si = 0; si < 9; si++) {
                const v    = board[bi][si];
                const cell = smallEls[bi][si];
                cell.textContent = v || '';
                cell.className   = 'small-cell' +
                    (v ? ' ' + v.toLowerCase() : '') +
                    (!over && playable && !v ? ' playable' : '');
            }
        }

        $('score-x').textContent = conquered('X');
        $('score-o').textContent = conquered('O');

        const turnEl = $('turn-indicator');
        const hintEl = $('hint-text');
        const overlay = $('overlay');

        if (over) {
            if (winner === 'draw') {
                turnEl.innerHTML = '平局';
                $('overlay-title').textContent = '平局';
                $('overlay-msg').textContent   = '双方势均力敌';
            } else {
                const cls = winner === 'X' ? 'mark-x' : 'mark-o';
                turnEl.innerHTML = `<span class="${cls}">${winner}</span> 获胜`;
                $('overlay-title').innerHTML = `<span class="${cls}">${winner}</span> 获胜`;
                $('overlay-msg').textContent = '大局已定';
            }
            hintEl.textContent    = '';
            overlay.style.display = 'flex';
        } else {
            overlay.style.display = 'none';
            const cls = player === 'X' ? 'mark-x' : 'mark-o';
            turnEl.innerHTML   = `轮到 <span class="${cls}">${player}</span>`;
            hintEl.textContent = active === null ? '自由选择任意大格' : '在高亮区域落子';
        }
    }

    // Build DOM once
    for (let bi = 0; bi < 9; bi++) {
        const bigEl = document.createElement('div');
        bigEl.className = 'big-cell';

        const ov = document.createElement('div');
        ov.style.display = 'none';
        bigEl.appendChild(ov);
        ovEls.push(ov);

        const cells = [];
        for (let si = 0; si < 9; si++) {
            const cell = document.createElement('div');
            cell.className = 'small-cell';
            cell.addEventListener('click', () => handleClick(bi, si));
            bigEl.appendChild(cell);
            cells.push(cell);
        }

        boardEl.appendChild(bigEl);
        bigEls.push(bigEl);
        smallEls.push(cells);
    }

    $('reset-btn').addEventListener('click', reset);
    $('overlay-btn').addEventListener('click', reset);
    reset();
})();
    </script>
</body>
</html>
