<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终极井字棋 — GameHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: min(90vw, 450px);
            aspect-ratio: 1;
            background: #1a1a1a;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }

        .big-cell {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: #111;
            border-radius: 4px;
            padding: 4px;
            position: relative;
            transition: opacity 0.2s;
        }

        .big-cell.active {
            box-shadow: inset 0 0 0 2px var(--accent);
            background: #1a1015;
        }

        .big-cell.conquered,
        .big-cell.full {
            opacity: 0.4;
        }

        .big-cell.free-target:not(.conquered):not(.full) {
            background: #1a1a1a;
        }

        .big-cell-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            pointer-events: none;
            z-index: 2;
        }

        .big-cell-overlay.x { color: var(--accent2); }
        .big-cell-overlay.o { color: var(--accent); }

        .small-cell {
            aspect-ratio: 1;
            background: #0a0a0a;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.7rem, 2.5vw, 1.1rem);
            font-weight: 700;
            cursor: default;
            transition: background 0.15s;
            position: relative;
            z-index: 3;
        }

        .small-cell.playable {
            cursor: pointer;
        }

        .small-cell.playable:hover {
            background: #1a1a2e;
        }

        .small-cell.x { color: var(--accent2); }
        .small-cell.o { color: var(--accent); }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .current-turn {
            font-size: 1rem;
            font-weight: 600;
        }

        .current-turn .mark-x { color: var(--accent2); }
        .current-turn .mark-o { color: var(--accent); }

        .hint {
            font-size: 0.8rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="../index.html">← 返回</a>

        <div class="game-wrapper">
            <div class="status-bar">
                <span class="current-turn" id="turn-indicator"></span>
                <span class="hint" id="hint-text"></span>
            </div>

            <div class="score">
                <div class="score-item">
                    <div class="score-label mark-x">X 占领</div>
                    <div class="score-value" id="score-x">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label mark-o">O 占领</div>
                    <div class="score-value" id="score-o">0</div>
                </div>
            </div>

            <div class="board" id="board"></div>

            <button class="btn" id="reset-btn" style="margin-top:24px;">重新开始</button>
        </div>
    </div>

    <div class="overlay" id="overlay" style="display:none;">
        <div class="overlay-content">
            <h2 id="overlay-title"></h2>
            <p id="overlay-msg"></p>
            <button class="btn" id="overlay-btn">再来一局</button>
        </div>
    </div>

    <script>
(function() {
    const WIN_LINES = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
    ];

    const boardEl = document.getElementById('board');
    const turnIndicator = document.getElementById('turn-indicator');
    const hintText = document.getElementById('hint-text');
    const scoreXEl = document.getElementById('score-x');
    const scoreOEl = document.getElementById('score-o');
    const resetBtn = document.getElementById('reset-btn');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const overlayBtn = document.getElementById('overlay-btn');

    let state;

    function initState() {
        state = {
            board: Array.from({length: 9}, () => Array(9).fill(null)),
            bigBoard: Array(9).fill(null),
            currentPlayer: 'X',
            activeBigCell: 4,
            gameOver: false,
            winner: null
        };
    }

    function checkWin(cells) {
        for (const [a,b,c] of WIN_LINES) {
            if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
                return cells[a];
            }
        }
        return null;
    }

    function isBigCellFull(bigIdx) {
        return state.board[bigIdx].every(cell => cell !== null);
    }

    function isBigCellPlayable(bigIdx) {
        if (state.gameOver) return false;
        if (state.bigBoard[bigIdx] !== null) return false;
        if (isBigCellFull(bigIdx)) return false;
        if (state.activeBigCell !== null && state.activeBigCell !== bigIdx) return false;
        return true;
    }

    function countConquered(player) {
        return state.bigBoard.filter(c => c === player).length;
    }

    function isGameDead() {
        for (let i = 0; i < 9; i++) {
            if (state.bigBoard[i] === null && !isBigCellFull(i)) return false;
        }
        return true;
    }

    function resolveGameOver() {
        const xCount = countConquered('X');
        const oCount = countConquered('O');
        if (xCount > oCount) state.winner = 'X';
        else if (oCount > xCount) state.winner = 'O';
        else state.winner = 'draw';
        state.gameOver = true;
    }

    function getNextActiveCell(smallIdx) {
        if (state.bigBoard[smallIdx] !== null || isBigCellFull(smallIdx)) {
            return null;
        }
        return smallIdx;
    }

    function makeMove(bigIdx, smallIdx) {
        if (!isBigCellPlayable(bigIdx)) return false;
        if (state.board[bigIdx][smallIdx] !== null) return false;

        state.board[bigIdx][smallIdx] = state.currentPlayer;

        const bigWinner = checkWin(state.board[bigIdx]);
        if (bigWinner) {
            state.bigBoard[bigIdx] = bigWinner;
        }

        const gameWinner = checkWin(state.bigBoard);
        if (gameWinner) {
            state.gameOver = true;
            state.winner = gameWinner;
        } else if (isGameDead()) {
            resolveGameOver();
        }

        state.currentPlayer = state.currentPlayer === 'X' ? 'O' : 'X';
        state.activeBigCell = getNextActiveCell(smallIdx);
        return true;
    }

    function render() {
        boardEl.innerHTML = '';

        for (let bi = 0; bi < 9; bi++) {
            const bigEl = document.createElement('div');
            bigEl.className = 'big-cell';

            if (isBigCellPlayable(bi)) {
                bigEl.classList.add('active');
            }
            if (state.activeBigCell === null && !state.gameOver) {
                if (state.bigBoard[bi] === null && !isBigCellFull(bi)) {
                    bigEl.classList.add('free-target');
                }
            }
            if (state.bigBoard[bi] !== null) {
                bigEl.classList.add('conquered');
                const overlayEl = document.createElement('div');
                overlayEl.className = 'big-cell-overlay ' + state.bigBoard[bi].toLowerCase();
                overlayEl.textContent = state.bigBoard[bi];
                bigEl.appendChild(overlayEl);
            } else if (isBigCellFull(bi)) {
                bigEl.classList.add('full');
            }

            for (let si = 0; si < 9; si++) {
                const cellEl = document.createElement('div');
                cellEl.className = 'small-cell';
                const val = state.board[bi][si];
                if (val) {
                    cellEl.textContent = val;
                    cellEl.classList.add(val.toLowerCase());
                }

                if (!state.gameOver && isBigCellPlayable(bi) && !val) {
                    cellEl.classList.add('playable');
                    cellEl.addEventListener('click', () => {
                        if (makeMove(bi, si)) {
                            render();
                            updateUI();
                        }
                    });
                }

                bigEl.appendChild(cellEl);
            }

            boardEl.appendChild(bigEl);
        }
    }

    function updateUI() {
        if (state.gameOver) {
            turnIndicator.innerHTML = '';
            if (state.winner === 'draw') {
                hintText.textContent = '平局';
                overlayTitle.textContent = '平局';
                overlayMsg.textContent = '双方势均力敌';
            } else {
                hintText.textContent = '';
                const cls = state.winner === 'X' ? 'mark-x' : 'mark-o';
                turnIndicator.innerHTML = '<span class="' + cls + '">' + state.winner + '</span> 获胜';
                overlayTitle.innerHTML = '<span class="' + cls + '">' + state.winner + '</span> 获胜';
                overlayMsg.textContent = '大局已定';
            }
            overlay.style.display = 'flex';
        } else {
            overlay.style.display = 'none';
            const cls = state.currentPlayer === 'X' ? 'mark-x' : 'mark-o';
            turnIndicator.innerHTML = '轮到 <span class="' + cls + '">' + state.currentPlayer + '</span>';

            if (state.activeBigCell === null) {
                hintText.textContent = '自由选择任意大格';
            } else {
                hintText.textContent = '高亮区域落子';
            }
        }

        scoreXEl.textContent = countConquered('X');
        scoreOEl.textContent = countConquered('O');
    }

    function startGame() {
        initState();
        render();
        updateUI();
    }

    resetBtn.addEventListener('click', startGame);
    overlayBtn.addEventListener('click', startGame);

    startGame();
})();
    </script>
</body>
</html>
